<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchMind Result</title>
    <link rel="stylesheet" href="score.css">
</head>
<body>

    <nav>
        <div class="logo">
            Match<span>Mind</span>
        </div>

        <div class="nav-right">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
            </ul>

            <a href="home.html" class="btn active">Play Now</a>
        </div>
    </nav>

    <div class="app">
        <header class="header">
            <div class="logo-box">
                <img src="MatchMind_Logo.png" alt="MatchMind Logo">
                <h1>MatchMind</h1>
            </div>
        </header>

        <section class="result">
            <div class="circle">5/5</div>

            <div class="result-text">
                <h2>Perfect Score!</h2>
                <p>Great job — you got all answers correct.</p>
            </div>
        </section>

        <section class="stats">
            <div class="card">
                <h3>5</h3>
                <p>Correct</p>
            </div>
            <div class="card">
                <h3>0</h3>
                <p>Wrong</p>
            </div>
            <div class="card">
                <h3>0</h3>
                <p>Skipped</p>
            </div>
        </section>

        <div class="button-container">
            <button class="start-btn" onclick="window.location.href='home.html'">
                Try Again
            </button>

            <button class="review" onclick="window.location.href='review.html'">
                Review Answers
            </button>
        </div>
    </div>

    <script src="score.js"></script>
</body>
</html>
